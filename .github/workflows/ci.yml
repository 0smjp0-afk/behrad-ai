name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Built worker is in sync with src/modules + web
        run: npm run build:check

      - name: Syntax check (worker)
        run: npm run check

      - name: Tests (i18n, module, integration)
        run: npm test
