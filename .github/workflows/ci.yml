name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify APP_ASSETS is in sync with web/
        run: node tools/build.mjs --check

      - name: Syntax check (worker.js)
        run: node tools/check_syntax.mjs src/worker.js

      - name: Tests
        run: node test/run.mjs
